<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#191019" />
  <title>Pinker Bar Menu</title>
  <style>
    :root{--bg:#120d12;--card:#1d151d;--text:#fff7fb;--muted:#c8b7c2;--accent:#ff5bbd;--line:#352635}
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(180deg,#100b10,#1b111b);color:var(--text)}
    .wrap{max-width:760px;margin:auto;padding:24px 16px 56px}
    header{text-align:center;padding:22px 8px 18px}
    .logo{font-size:42px;font-weight:800;letter-spacing:.08em;color:var(--accent)}
    .tag{color:var(--muted);margin-top:6px}
    .langs{display:flex;gap:8px;justify-content:center;position:sticky;top:0;z-index:5;padding:12px 0;background:rgba(18,13,18,.92);backdrop-filter:blur(12px)}
    button{border:1px solid var(--line);background:#211721;color:var(--text);padding:10px 14px;border-radius:999px;font-weight:700;cursor:pointer}
    button.active{background:var(--accent);color:#25101e;border-color:var(--accent)}
    .section{margin-top:22px}
    .section h2{font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:0 0 10px}
    .card{background:rgba(29,21,29,.92);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 12px 34px rgba(0,0,0,.18)}
    .item{display:flex;justify-content:space-between;gap:14px;padding:14px 16px;border-bottom:1px solid var(--line);align-items:flex-start}
    .item:last-child{border-bottom:0}
    .name{font-weight:650;line-height:1.25}
    .price{white-space:nowrap;font-weight:800;color:#ffd5ee}
    footer{text-align:center;color:var(--muted);font-size:13px;margin-top:30px}
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">PINKER</div>
    <div class="tag" id="tagline">Bar menu</div>
  </header>
  <div class="langs">
    <button data-lang="ru">Русский</button>
    <button data-lang="en" class="active">English</button>
    <button data-lang="ko">한국어</button>
  </div>
  <main id="menu"></main>
  <footer id="footer">Prices in thousands of VND</footer>
</div>

let lang='en';

function render(){
  document.documentElement.lang=lang;
  document.getElementById('tagline').textContent=labels[lang].tag;
  document.getElementById('footer').textContent=labels[lang].foot;
  document.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));
  document.getElementById('menu').innerHTML=data.map(s=>`<section class="section"><h2>${s[lang]}</h2><div class="card">${s.items.map(i=>`<div class="item"><div class="name">${i[lang==='ru'?0:lang==='en'?1:2]}</div><div class="price">${i[3]}</div></div>`).join('')}</div></section>`).join('');
}
document.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{lang=b.dataset.lang;render()}));
render();

</html>
