<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#080808" />
  <title>Picker Lounge Bar Menu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;900&family=Roboto+Condensed:wght@400;700;900&family=Tektur:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#050505;
      --panel:rgba(10,5,6,.68);
      --panel-strong:rgba(8,3,4,.84);
      --text:#ffffff;
      --muted:#d8c2c2;
      --accent:#ff002b;
      --accent-soft:#ff314d;
      --line:rgba(255,255,255,.16);
      --cut:16px;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      min-height:100vh;
      font-family:"Roboto Condensed","Noto Sans KR",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      color:var(--text);
      background:
        linear-gradient(180deg,rgba(0,0,0,.52),rgba(0,0,0,.9)),
        radial-gradient(circle at 18% 12%,rgba(255,0,43,.3),transparent 26%),
        url("assets/picker-bg.jpg") center top / cover no-repeat,
        #050505;
      background-attachment:fixed;
    }
    body::before{
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      background:
        linear-gradient(90deg,rgba(0,0,0,.72),rgba(0,0,0,.2) 44%,rgba(0,0,0,.82)),
        repeating-linear-gradient(135deg,rgba(255,255,255,.026) 0 1px,transparent 1px 10px);
      z-index:-1;
    }
    .wrap{max-width:820px;margin:auto;padding:18px 14px 58px}
    .hero{
      position:relative;
      overflow:hidden;
      border:1px solid rgba(255,255,255,.16);
      border-radius:0;
      clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%,0 var(--cut));
      padding:34px 18px 28px;
      text-align:center;
      background:
        linear-gradient(145deg,rgba(255,49,77,.16),rgba(255,255,255,.018)),
        rgba(6,3,4,.78);
      box-shadow:0 24px 70px rgba(0,0,0,.52),inset 0 1px 0 rgba(255,255,255,.08);
      backdrop-filter:blur(14px) saturate(130%);
      -webkit-backdrop-filter:blur(14px) saturate(130%);
    }
    .hero::after{
      content:"";
      position:absolute;
      inset:auto -20% -55% -20%;
      height:220px;
      background:radial-gradient(circle,rgba(255,0,43,.42),transparent 65%);
      filter:blur(16px);
      pointer-events:none;
    }
    .mark{
      width:82px;
      height:82px;
      margin:0 auto 16px;
      border-radius:50%;
      display:grid;
      place-items:center;
      color:#fff;
      font-size:46px;
      font-family:"Tektur","Roboto Condensed",sans-serif;
      font-weight:900;
      letter-spacing:-.08em;
      background:linear-gradient(145deg,#ff002b,#8f0018);
      box-shadow:0 0 34px rgba(255,0,0,.4),inset 0 1px 0 rgba(255,255,255,.28);
    }
    .logo{
      font-family:"Tektur","Roboto Condensed",sans-serif;
      font-size:48px;
      line-height:.95;
      font-weight:900;
      letter-spacing:.1em;
      text-transform:uppercase;
      text-shadow:0 0 22px rgba(255,0,43,.45);
    }
    .logo span{color:var(--accent-soft)}
    .tag{color:var(--muted);margin-top:10px;font-size:13px;font-weight:700;letter-spacing:.24em;text-transform:uppercase}
    .langs{
      display:flex;
      gap:8px;
      justify-content:center;
      position:sticky;
      top:8px;
      z-index:20;
      width:max-content;
      max-width:100%;
      margin:14px auto 0;
      padding:7px;
      border:1px solid rgba(255,255,255,.15);
      border-radius:0;
      clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);
      background:rgba(8,3,4,.72);
      box-shadow:0 14px 34px rgba(0,0,0,.32),inset 0 1px 0 rgba(255,255,255,.08);
      backdrop-filter:blur(18px);
      -webkit-backdrop-filter:blur(18px);
    }
    button{
      border:0;
      background:transparent;
      color:#e8e8e8;
      padding:10px 14px;
      border-radius:0;
      font-family:"Tektur","Noto Sans KR",sans-serif;
      font-weight:800;
      letter-spacing:.04em;
      cursor:pointer;
    }
    button.active{background:linear-gradient(135deg,#ff314d,#b90020);color:#fff;box-shadow:0 8px 20px rgba(255,0,43,.28)}
    .section{margin-top:18px}
    .section h2{
      font-size:14px;
      font-family:"Tektur","Noto Sans KR",sans-serif;
      letter-spacing:.16em;
      text-transform:uppercase;
      color:#fff;
      margin:0 0 9px 4px;
      display:flex;
      align-items:center;
      gap:10px;
    }
    .section h2::before{content:"";width:28px;height:3px;background:linear-gradient(90deg,var(--accent-soft),transparent)}
    .card{
      overflow:hidden;
      border:1px solid rgba(255,255,255,.12);
      border-radius:0;
      clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);
      background:linear-gradient(145deg,rgba(255,49,77,.1),rgba(255,255,255,.018)),var(--panel);
      box-shadow:0 18px 46px rgba(0,0,0,.34),inset 0 1px 0 rgba(255,255,255,.06);
      backdrop-filter:blur(13px) saturate(125%);
      -webkit-backdrop-filter:blur(13px) saturate(125%);
    }
    .item{
      display:flex;
      justify-content:space-between;
      gap:16px;
      padding:15px 16px;
      border-bottom:1px solid var(--line);
      align-items:flex-start;
    }
    .item:last-child{border-bottom:0}
    .name{font-weight:720;line-height:1.28}
    .price{white-space:nowrap;font-family:"Tektur","Roboto Condensed",sans-serif;font-weight:900;color:#fff;text-shadow:0 0 16px rgba(255,0,43,.35)}
    footer{
      text-align:center;
      color:#a8a8a8;
      font-size:12px;
      margin-top:28px;
      letter-spacing:.08em;
      text-transform:uppercase;
    }
    @media (max-width:560px){
      .wrap{padding:12px 10px 42px}
      .hero{padding:28px 14px 24px}
      .logo{font-size:38px}
      .tag{font-size:11px;letter-spacing:.17em}
      button{padding:9px 11px;font-size:13px}
      .item{padding:14px}
    }
  </style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="mark">P</div>
    <div class="logo">PICK<span>ER</span></div>
    <div class="tag" id="tagline">Lounge Bar · Nha Trang</div>
  </header>
  <div class="langs">
    <button data-lang="ru">Русский</button>
    <button data-lang="en" class="active">English</button>
    <button data-lang="ko">한국어</button>
  </div>
  <main id="menu"></main>
  <footer id="footer">Prices in thousands of VND</footer>
</div>

let lang='en';
const labels={ru:{tag:'Lounge Bar · Нячанг',foot:'Цены указаны в тысячах VND'},en:{tag:'Lounge Bar · Nha Trang',foot:'Prices in thousands of VND'},ko:{tag:'라운지 바 · 나트랑',foot:'가격은 천 VND 단위입니다'}};
function render(){
  document.documentElement.lang=lang;
  document.getElementById('tagline').textContent=labels[lang].tag;
  document.getElementById('footer').textContent=labels[lang].foot;
  document.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));
  document.getElementById('menu').innerHTML=data.map(s=>`<section class="section"><h2>${s[lang]}</h2><div class="card">${s.items.map(i=>`<div class="item"><div class="name">${i[lang==='ru'?0:lang==='en'?1:2]}</div><div class="price">${i[3]}</div></div>`).join('')}</div></section>`).join('');
}
document.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{lang=b.dataset.lang;render()}));
render();

</html>
