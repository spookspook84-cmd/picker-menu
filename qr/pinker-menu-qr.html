<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Picker Menu QR</title>
  <style>
    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      background:#050505;
      color:#fff;
      font-family:Arial,sans-serif;
    }
    .card{
      width:min(92vw,520px);
      padding:28px;
      text-align:center;
      background:#fff;
      color:#111;
      border-radius:24px;
    }
    img{width:100%;height:auto;display:block}
    p{margin:18px 0 0;font-size:16px;word-break:break-all}
  </style>
</head>
<body>
  <div class="card">
    <img
      src="https://api.qrserver.com/v1/create-qr-code/?size=1200x1200&margin=20&data=https%3A%2F%2Fspookspook84-cmd.github.io%2Fpicker-menu%2F"
      alt="QR code for Picker menu">
    <p>https://spookspook84-cmd.github.io/picker-menu/</p>
  </div>
</body>
</html>
